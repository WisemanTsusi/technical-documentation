openapi: 3.2.1
info:
  title: Generic SaaS API
  version: 1.0.0
  description: Sanitized portfolio reference API.
servers:
  - url: https://api.example.com
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/resources:
    get:
      summary: List resources
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Resource page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Resource:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ResourcePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Resource'}
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        requestId: {type: string}
